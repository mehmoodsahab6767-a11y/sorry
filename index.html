<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>for kinzu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
<style>
:root{--pw:min(43vw,50vh);--ph:calc(var(--pw)*1.25);--ink:#5a3418;--rose:#c2185b;--paper:#fff6ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);font-family:"Caveat","Segoe Print","Bradley Hand",cursive;
 background:
  radial-gradient(ellipse at 50% 40%,rgba(255,235,190,.35),transparent 65%),
  radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(70,40,10,.35)),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .08  0 0 0 .5 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"),
  #c9a272;}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2200px;transition:transform 1.1s cubic-bezier(.6,0,.25,1);transform:translateX(calc(var(--pw)*-.5))}
.book.open{transform:none}
.page,.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph)}
.page{background:var(--paper);box-shadow:0 0 0 5px var(--paper),0 14px 30px rgba(60,35,10,.45)}
.page::after{content:"";position:absolute;inset:0;pointer-events:none}
.left{left:0;opacity:0;transition:none}.left::after{background:linear-gradient(to left,rgba(60,20,10,.28),transparent 14%)}
.book.open .left{opacity:1;transition:opacity .3s .55s}
.right{left:50%}.right::after{background:linear-gradient(to right,rgba(60,20,10,.28),transparent 14%)}
.page::before{content:"";position:absolute;top:-10px;width:26%;height:7%;background:rgba(255,214,120,.78);transform:rotate(-6deg);z-index:6;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.left::before{left:-7%}.right::before{right:-7%;transform:rotate(7deg);background:rgba(244,160,185,.8)}
.fill{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.leaf{left:50%;transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.6,0,.25,1);cursor:pointer;z-index:5}
.book.open .leaf{transform:rotateY(-180deg);pointer-events:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);box-shadow:0 0 0 5px var(--paper),0 14px 30px rgba(60,35,10,.45)}
.face img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 100%}
.face.back{transform:rotateY(180deg)}.face.back img{object-fit:fill}
.peek{position:absolute;left:24%;top:30%;width:28%;height:60%;background:none;border:0;cursor:pointer;z-index:3;border-radius:6px}
.peek:focus-visible{outline:3px dashed var(--rose)}
.peek.pulse{animation:pk 1.8s ease-in-out infinite}
@keyframes pk{50%{background:rgba(255,255,255,.28)}}
.tag{position:absolute;left:50%;top:7%;z-index:4;transform:translateX(-50%) rotate(-3deg);white-space:nowrap;background:#fff0f4;color:var(--rose);font-size:calc(var(--pw)*.095);line-height:1;padding:.2em .6em .25em;box-shadow:2px 3px 0 #e7a3b9,0 4px 10px rgba(80,20,40,.25);pointer-events:none;transition:opacity .4s}
.tag.gone{opacity:0}
.flame{position:absolute;transform-origin:50% 96%;transition:opacity .4s;
 transform:rotate(calc(var(--b,0)*var(--k)*44deg)) skewX(calc(var(--b,0)*var(--k)*-24deg)) scaleY(calc(1 - var(--b,0)*.28))}
.flame img{display:block;width:100%;transform-origin:50% 100%;animation:fl .75s ease-in-out infinite alternate;filter:drop-shadow(0 0 7px rgba(255,205,90,.85))}
.flame:nth-of-type(2) img{animation-duration:.9s}.flame:nth-of-type(3) img{animation-duration:.65s}
@keyframes fl{from{transform:rotate(-2.5deg) scaleY(.97)}to{transform:rotate(3deg) scaleY(1.05)}}
.flame.out{transition:transform .4s ease-in,opacity .4s;transform:rotate(55deg) scale(.15,.02);opacity:0}
.smoke{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(6px);pointer-events:none;animation:rise 1.6s ease-out forwards;z-index:4}
@keyframes rise{to{transform:translate(14px,-70px) scale(2.4);opacity:0}}
.love{position:absolute;left:50%;top:11%;z-index:7;width:84%;text-align:center;padding:.15em .3em .2em;background:#fff0f4;color:var(--rose);
 font-size:calc(var(--pw)*.15);line-height:1.05;transform:translateX(-50%) rotate(-3deg) scale(.4);opacity:0;pointer-events:none;
 box-shadow:3px 4px 0 #e7a3b9,0 8px 18px rgba(80,20,40,.3);transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .4s}
.love.show{transform:translateX(-50%) rotate(-3deg) scale(1);opacity:1}
.controls{width:min(92vw,calc(var(--pw)*2 + 10px));display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:center;min-height:44px;font-size:clamp(17px,3.6vw,22px)}
.controls[hidden],[hidden]{display:none!important}
button.btn{font:inherit;color:#fff;background:var(--rose);border:0;padding:.3em .9em;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #8d1142,0 6px 12px rgba(60,20,10,.3);touch-action:manipulation;user-select:none;-webkit-user-select:none}
button.btn:active,button.btn.held{transform:translateY(2px);box-shadow:0 1px 0 #8d1142}
button.btn.alt{background:#fff6ea;color:var(--ink);box-shadow:0 3px 0 #b48a5a,0 6px 12px rgba(60,20,10,.25)}
.meterwrap{display:flex;align-items:center;gap:8px}
.meter{width:min(120px,26vw);height:12px;background:rgba(255,246,234,.8);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6a5bf,#c2185b)}
#status{flex-basis:100%;text-align:center;font-size:.85em;opacity:.9}
#veil{position:fixed;inset:0;background:rgba(45,22,6,.6);opacity:0;pointer-events:none;transition:opacity .5s;z-index:19}
#veil.on{opacity:1;pointer-events:auto}
#letterFx{position:fixed;left:50%;top:50%;width:min(86vw,58vh);z-index:20;opacity:0;pointer-events:none;border-radius:3px;box-shadow:0 18px 50px rgba(0,0,0,.55);transform:translate(-50%,-50%);user-select:none;-webkit-user-drag:none}
#letterFx.on{pointer-events:auto;cursor:pointer}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){.flame img{animation:none}}
</style>
</head>
<body>
<main class="stage">
 <div class="book" id="book">
  <section class="page left" id="leftPage">
   <img class="fill" data-img="env" alt="Envelope with a letter tucked inside">
   <button class="peek pulse" id="peek" aria-label="Lift the letter"></button>
   <div class="tag" id="tag">tap the letter to read</div>
  </section>
  <section class="page right" id="cakePage">
   <img class="fill" data-img="cake" alt="Cake with three candles">
   <div class="flame" style="left:47.06%;top:44.45%;width:8.2%;--k:1"><img data-img="f1" alt=""></div>
   <div class="flame" style="left:71.08%;top:53.95%;width:7.25%;--k:.85"><img data-img="f2" alt=""></div>
   <div class="flame" style="left:25.39%;top:54.02%;width:7.25%;--k:1.1"><img data-img="f3" alt=""></div>
   <div class="love" id="love">i love you, <span id="nm"></span></div>
  </section>
  <div class="leaf" id="leaf" role="button" tabindex="0" aria-label="Open the card">
   <div class="face front"><img data-img="cover" alt="Card cover"></div>
   <div class="face back"><img data-img="env" alt=""></div>
  </div>
 </div>
 <div class="controls" id="ctlClosed"><span>tap the cover to open</span></div>
 <div class="controls" id="ctlOpen" hidden>
  <button class="btn alt" id="backBtn">back to cover</button>
  <div class="meterwrap" id="meterWrap"><span>mic</span><div class="meter"><i id="lvl"></i></div></div>
  <button class="btn" id="holdBtn">hold to blow</button>
  <button class="btn alt" id="micBtn" hidden>use mic</button>
  <button class="btn" id="relightBtn" hidden>relight</button>
  <div id="status"></div>
 </div>
</main>
<div id="veil"></div>
<img id="letterFx" data-img="letter" alt="The letter" draggable="false">
<canvas id="confetti"></canvas>

document.querySelectorAll("[data-img]").forEach(e=>e.src=IMG[e.dataset.img]);
document.getElementById("nm").textContent=NAME;
const $=id=>document.getElementById(id);
const book=$("book"),leaf=$("leaf"),cake=$("cakePage"),flames=[...cake.querySelectorAll(".flame")];
let isOpen=false,letterUp=false,out=false,busy=false;

/* ---------- open / close ---------- */
function openCard(){
  if(isOpen||busy)return; busy=true; isOpen=true;
  book.classList.add("open"); $("ctlClosed").hidden=true; $("ctlOpen").hidden=false;
  startMic();
  setTimeout(()=>{leaf.style.visibility="hidden";busy=false;},1150);
  requestAnimationFrame(loop);
}
function closeCard(){
  if(!isOpen||busy||letterUp)return; busy=true; isOpen=false;
  leaf.style.visibility="visible"; void leaf.offsetWidth;
  book.classList.remove("open"); $("ctlOpen").hidden=true; $("ctlClosed").hidden=false;
  stopMic(); relight(true);
  setTimeout(()=>busy=false,1150);
}
leaf.addEventListener("click",openCard);
leaf.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openCard();}});
$("backBtn").addEventListener("click",closeCard);

/* ---------- letter ---------- */
const fx=$("letterFx"),veil=$("veil");
function tuckTransform(){
  const r=$("leftPage").getBoundingClientRect();
  const dx=r.left+r.width*.38-innerWidth/2, dy=r.top+r.height*.6-innerHeight/2;
  const s=(r.width*.3)/(fx.offsetWidth||300);
  return `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(${s}) rotate(-7deg)`;
}
function liftLetter(){
  if(letterUp||!isOpen)return; letterUp=true; $("peek").classList.remove("pulse"); $("tag").classList.add("gone");
  fx.style.transition="none"; fx.style.transform=tuckTransform(); fx.style.opacity="0"; void fx.offsetWidth;
  fx.style.transition="transform .65s cubic-bezier(.2,.9,.3,1),opacity .35s";
  fx.style.transform="translate(-50%,-50%)"; fx.style.opacity="1"; fx.classList.add("on"); veil.classList.add("on");
}
function tuckLetter(){
  if(!letterUp)return; letterUp=false; fx.classList.remove("on"); veil.classList.remove("on");
  fx.style.transition="transform .55s cubic-bezier(.6,0,.4,1),opacity .3s .25s";
  fx.style.transform=tuckTransform(); fx.style.opacity="0";
}
$("peek").addEventListener("click",liftLetter);
fx.addEventListener("click",tuckLetter); veil.addEventListener("click",tuckLetter);

/* ---------- microphone ---------- */
let ctx=null,stream=null,an=null,buf=null,micOn=false,floor=.01;
const status=t=>$("status").textContent=t;
async function startMic(){
  if(micOn)return;
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    status("the mic needs https (host this file, don't open it locally). hold the button or space bar to blow."); $("micBtn").hidden=true; return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ctx=new (window.AudioContext||window.webkitAudioContext)(); await ctx.resume();
    const src=ctx.createMediaStreamSource(stream); an=ctx.createAnalyser(); an.fftSize=1024; src.connect(an);
    buf=new Float32Array(an.fftSize); micOn=true; floor=.01; $("micBtn").hidden=true;
    status("mic is listening, blow on the candles");
  }catch(e){
    status("couldn't use the mic. hold the button or space bar to blow."); $("micBtn").hidden=false;
  }
}
function stopMic(){
  if(stream)stream.getTracks().forEach(t=>t.stop()); if(ctx)ctx.close().catch(()=>{});
  ctx=stream=an=null; micOn=false; $("lvl").style.width="0";
}
$("micBtn").addEventListener("click",startMic);

/* ---------- blowing ---------- */
let manual=false,bend=0,blowT=0,last=0;
const hold=$("holdBtn");
const setHold=v=>{manual=v;hold.classList.toggle("held",v);};
["pointerdown"].forEach(ev=>hold.addEventListener(ev,e=>{e.preventDefault();hold.setPointerCapture(e.pointerId);setHold(true);}));
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>hold.addEventListener(ev,()=>setHold(false)));
hold.addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("keydown",e=>{
  if(e.key==="Escape")tuckLetter();
  if(e.code==="Space"&&isOpen&&!letterUp&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();setHold(true);}
});
addEventListener("keyup",e=>{if(e.code==="Space")setHold(false);});

function loop(t){
  if(!isOpen&&!busy){return;}
  const dt=Math.min(.05,(t-last)/1000||0); last=t;
  let rms=0,strength=0;
  if(micOn){
    an.getFloatTimeDomainData(buf); let s=0; for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i]; rms=Math.sqrt(s/buf.length);
    const thr=Math.max(floor*2.6,.04);
    if(rms<thr)floor=floor*.97+rms*.03;
    strength=Math.max(0,Math.min(1,(rms-thr)/.12+(rms>thr?.25:0)));
    $("lvl").style.width=Math.min(100,rms/.18*100)+"%";
  }
  if(manual){strength=Math.max(strength,.85);$("lvl").style.width="85%";}
  if(out||letterUp)strength=0;
  bend+=(strength-bend)*Math.min(1,dt*14);
  cake.style.setProperty("--b",bend.toFixed(3));
  if(strength>.05)blowT+=dt; else blowT=Math.max(0,blowT-dt*2);
  if(!out&&blowT>=.5)extinguish();
  requestAnimationFrame(loop);
}

/* ---------- flames out / relight ---------- */
function extinguish(){
  out=true; blowT=0;
  flames.forEach((f,i)=>setTimeout(()=>{
    f.classList.add("out");
    const s=document.createElement("div"); s.className="smoke";
    s.style.left=`calc(${parseFloat(f.style.left)}% + ${parseFloat(f.style.width)/2}% - 3%)`; s.style.top=f.style.top;
    cake.appendChild(s); setTimeout(()=>s.remove(),1700);
  },i*140));
  setTimeout(()=>{ if(!out)return; $("love").classList.add("show"); $("relightBtn").hidden=false; $("holdBtn").hidden=true; confetti(); },650);
}
function relight(quiet){
  out=false; blowT=0; bend=0; cake.style.setProperty("--b",0);
  flames.forEach(f=>f.classList.remove("out")); $("love").classList.remove("show");
  $("relightBtn").hidden=true; $("holdBtn").hidden=false;
}
$("relightBtn").addEventListener("click",()=>relight());

/* ---------- confetti ---------- */
function confetti(){
  const c=$("confetti"),g=c.getContext("2d"),dpr=Math.min(2,devicePixelRatio||1);
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;
  const cols=["#c2185b","#f48fb1","#ffd36e","#fff0f4","#e53935","#ff8a65"];
  const P=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*innerWidth*.3,y:innerHeight*.55,
    vx:(Math.random()-.5)*14,vy:-Math.random()*17-6,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,col:cols[Math.random()*cols.length|0]}));
  let n=0;
  (function f(){
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=.32;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.col;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore();});
    if(++n<260)requestAnimationFrame(f); else g.clearRect(0,0,innerWidth,innerHeight);
  })();
}
</script>
